[package]
name = "abakus"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "abakus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
keyring = "4"
parser = { path = "../crates/parser" }
rules = { path = "../crates/rules" }
store = { path = "../crates/store" }
netstat2 = "0.11.2"
thiserror.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
lopdf = "0.44"
ttf-parser = "0.25.1"
tempfile = "3"
unicode-normalization = "0.1"

[dev-dependencies]
regex.workspace = true
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true

# Tauri decides dev-vs-production at COMPILE time from this feature:
# `tauri-codegen`'s context.rs sets `dev: cfg!(not(feature = "custom-protocol"))`.
# Without it the binary keeps `build.devUrl` (http://localhost:1420) and embeds
# no frontend at all, so an installed exe opens WebView2 on a dev server that
# never runs and shows ERR_CONNECTION_REFUSED. `tauri dev` must NOT set it (it
# wants the live dev server), so the release build passes it explicitly instead
# of the dependency enabling it always. Grok t16b-verify FAIL, 2026-08-31.
[features]
custom-protocol = ["tauri/custom-protocol"]
